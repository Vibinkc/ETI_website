# ETI public website.
#
#   docker compose up --build
#
# Joins the network created by ../eti_website_cms_backend, so bring that stack
# up first — the site reads its content from the API there.

name: eti-website

services:
  website:
    build:
      context: .
      args:
        # Baked in at build time: the pages prerender against it. Unreachable
        # is not fatal — every field falls back to the value it shipped with.
        CMS_API_URL: ${CMS_API_URL:-http://api:8000}
    image: eti-website:latest
    restart: unless-stopped
    environment:
      # Read at runtime, for revalidation fetches after a CMS publish.
      CMS_API_URL: ${CMS_API_URL:-http://api:8000}
      # Must match the backend's REVALIDATE_SECRET or publishes are rejected.
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?set REVALIDATE_SECRET in .env}
    ports:
      - "3000:3000"

networks:
  default:
    name: eti-network
    external: true
