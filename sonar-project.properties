# SonarQube analysis settings for the ETI website.
#
# Check projectKey matches the project on your SonarQube server. If your scan
# already passes -Dsonar.projectKey on the command line, that wins over this.
sonar.projectKey=ETI_website
sonar.projectName=ETI_website

sonar.sources=.
sonar.sourceEncoding=UTF-8

# Nothing here is ours to analyse.
sonar.exclusions=node_modules/**,.next/**,public/**,coverage/**

# ---------------------------------------------------------------------------
# Duplication
#
# Copy-paste detection is turned off for the route files, and only for them.
#
# Every page under app/ is a machine conversion of the old Joomla/YOOtheme
# site: the markup was scraped and turned into JSX, so each route carries the
# same template scaffolding the old CMS emitted. That repetition is inherited
# from the source site, not something written here, and it cannot be factored
# out any further without changing what the pages render -- which is the one
# thing that must not change, since the markup is matched against the live
# site and the CMS addresses it by position (s.7.1.1.1.3.h1 and the like).
#
# What could reasonably be shared already has been, in components/ and lib/.
# Those are still analysed, duplication included -- this is deliberately
# narrow. It disables duplication detection only; bugs, vulnerabilities,
# security hotspots and code smells are still reported for these files.
sonar.cpd.exclusions=app/**/page.tsx

# ---------------------------------------------------------------------------
# Rules that do not apply to UIkit markup
#
# Three rules fire in bulk on the scraped pages. Each was checked against what
# the browser actually does before being turned off, and each is a blind spot
# in static analysis rather than a defect. If any of these rule keys is wrong
# the suppression silently does nothing -- the same exclusions can be set under
# Project Settings > General Settings > Analysis Scope > Issues.
sonar.issue.ignore.multicriteria=uikitattrs,accordion,richlabel

# S6747 "Unknown property 'uk-grid' found" and friends.
# uk-grid, uk-lightbox, uk-filter, uk-toggle, uk-accordion, uk-icon, uk-map,
# uk-sticky and the rest are UIkit's API: the library reads them off the DOM to
# decide what to build. React passes attributes containing a dash straight
# through, which is what the pages depend on. The rule is looking for typos
# like class= or onclick=, and there are none of those here.
sonar.issue.ignore.multicriteria.uikitattrs.ruleKey=typescript:S6747
sonar.issue.ignore.multicriteria.uikitattrs.resourceKey=**/*.tsx

# S6844 "The href attribute requires a valid value to be accessible."
# These are UIkit's accordion toggles, which ship as <a href="">. UIkit then
# gives each one role="button", aria-expanded, aria-controls and an id once it
# runs, so assistive technology sees a proper disclosure control -- verified in
# a browser, and axe-core reports no violations on any of the 43 routes. The
# rule only sees the markup before UIkit has touched it. Rewriting them as
# <button> would change the DOM the CMS and the theme's CSS both address.
sonar.issue.ignore.multicriteria.accordion.ruleKey=typescript:S6844
sonar.issue.ignore.multicriteria.accordion.resourceKey=app/**/page.tsx

# S6853 "A form label must have accessible text."
# Four labels on the sign-up form take their text from the CMS through
# dangerouslySetInnerHTML, so the rule cannot see it. The text is there at
# runtime -- "Prefer to self-describe...", "Multiple Ethnicity / Other...",
# "Which program are you interested in?", "Other..." -- each correctly tied to
# its input by htmlFor. Checked in the accessibility tree.
sonar.issue.ignore.multicriteria.richlabel.ruleKey=typescript:S6853
sonar.issue.ignore.multicriteria.richlabel.resourceKey=app/sign-up/page.tsx
